<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이로은 덱</title>
<script src="data.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }

  /* ── 배경 (Student와 동일) ── */
  #bg { position: fixed; inset: 0; z-index: 0; }
  #bg iframe { width: 100%; height: 100%; border: none; display: block; }
  #bg-blocker { position: fixed; inset: 0; z-index: 1; }

  /* ── 블루 글래스 + 3D 빛 반사 ── */
  #glass {
    position: fixed; inset: 0; z-index: 2;
    background: rgba(8, 16, 55, 0.30);
    backdrop-filter: blur(26px) saturate(1.6) brightness(0.82);
    -webkit-backdrop-filter: blur(26px) saturate(1.6) brightness(0.82);
    pointer-events: none;
  }
  /* 상단-좌측 하이라이트 & 우하단 반사 */
  #glass::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 18% 0%,   rgba(170, 210, 255, 0.13) 0%, transparent 42%),
      radial-gradient(ellipse at 82% 100%, rgba(100, 145, 255, 0.08) 0%, transparent 38%),
      radial-gradient(ellipse at 50% 50%,  rgba(90,  130, 230, 0.04) 0%, transparent 55%),
      linear-gradient(135deg, rgba(190, 220, 255, 0.06) 0%, transparent 32%, rgba(120, 165, 255, 0.03) 100%);
  }
  /* 상단 광선 라인 */
  #glass::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(130, 185, 255, 0.28) 18%,
      rgba(200, 228, 255, 0.72) 50%,
      rgba(130, 185, 255, 0.28) 82%,
      transparent 100%);
  }

  /* ── 상단 네비 ── */
  #nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 28px;
    border-bottom: 1px solid rgba(120, 170, 255, 0.12);
  }
  #nav-spacer { flex: 1; }

  .nav-roles { display: flex; gap: 8px; }
  .role-btn {
    padding: 7px 18px; border-radius: 20px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.06em;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.45);
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
  }
  .role-btn:hover { background: rgba(255,255,255,0.12); color: white; }

  /* 일차 탭 (중앙) */
  .day-tabs { display: flex; gap: 6px; }
  .day-tab {
    padding: 6px 18px; border-radius: 18px;
    font-size: 12px; letter-spacing: 0.06em;
    border: 1px solid rgba(100, 150, 255, 0.18);
    background: rgba(50, 90, 200, 0.07);
    color: rgba(150, 190, 255, 0.4);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .day-tab.active {
    background: rgba(80, 130, 255, 0.20);
    border-color: rgba(130, 178, 255, 0.52);
    color: rgba(215, 232, 255, 0.95);
    box-shadow: 0 0 14px rgba(100,150,255,0.14);
  }
  .day-tab:hover:not(.active):not(.locked) {
    background: rgba(60,100,220,0.13);
    color: rgba(190, 215, 255, 0.7);
    border-color: rgba(110,160,255,0.3);
  }
  .day-tab.locked { opacity: 0.35; cursor: default; }

  /* ── 메인 콘텐츠 ── */
  #content {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
  }

  .deck-title {
    font-size: 13px; color: rgba(160,198,255,0.45);
    letter-spacing: 0.22em; text-transform: uppercase;
  }

  /* ── 5개 카드 슬롯 ── */
  .slots-row {
    display: flex; gap: 22px; align-items: flex-end;
  }

  .slot-wrap {
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
  }

  .card-slot {
    width: 120px; height: 168px;
    border-radius: 12px;
    position: relative; overflow: hidden;
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }

  /* 채워진 슬롯 */
  .card-slot.filled {
    cursor: pointer;
    border: 1px solid rgba(180,160,255,0.25);
    box-shadow: 0 6px 24px rgba(100,60,220,0.25), 0 0 20px rgba(140,100,255,0.15);
  }
  .card-slot.filled:hover {
    transform: translateY(-8px);
    box-shadow: 0 14px 40px rgba(100,60,220,0.4), 0 0 30px rgba(160,120,255,0.25);
  }
  .card-slot.filled img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .card-slot.filled .slot-emotion-tag {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 18px 6px 7px;
    background: linear-gradient(transparent, rgba(0,0,0,0.55));
    font-size: 10px; color: rgba(255,255,255,0.85);
    text-align: center; letter-spacing: 0.05em;
  }

  /* 미개봉 슬롯 (unlocked, no card) */
  .card-slot.unplayed {
    cursor: pointer;
    background: rgba(60, 100, 200, 0.10);
    border: 1px dashed rgba(120,170,255,0.32);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
  }
  .card-slot.unplayed:hover {
    background: rgba(80,130,255,0.18);
    border-color: rgba(160,200,255,0.55);
    transform: translateY(-6px);
    box-shadow: 0 12px 32px rgba(80,120,255,0.2);
  }
  .unplayed-icon { font-size: 28px; opacity: 0.55; }
  .unplayed-label { font-size: 11px; color: rgba(160,200,255,0.55); letter-spacing: 0.1em; }

  /* 잠긴 슬롯 */
  .card-slot.locked {
    background: rgba(40,60,120,0.06);
    border: 1px dashed rgba(100,140,255,0.10);
    display: flex; align-items: center; justify-content: center;
    cursor: default; opacity: 0.35;
  }
  .locked-icon { font-size: 22px; opacity: 0.4; }

  /* 일차 레이블 */
  .slot-day-label {
    font-size: 12px; color: rgba(160,195,255,0.45);
    letter-spacing: 0.08em;
  }

  /* ─────────────────────────────────
     3D 카드 뷰어 모달
  ───────────────────────────────── */
  #modal {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(4, 8, 30, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #modal.active { opacity: 1; pointer-events: auto; }

  /* ── 3D 카드 씬 (index.html에서 차용) ── */
  .scene {
    width: 260px; height: 364px;
    perspective: 900px;
  }
  .float-wrap {
    width: 100%; height: 100%;
    animation: cardFloat 4s ease-in-out infinite;
  }
  .c3d {
    width: 100%; height: 100%;
    position: relative; transform-style: preserve-3d;
    animation: cardSpin 8s linear infinite;
    cursor: pointer;
  }
  .c3d-face {
    position: absolute; inset: 0; border-radius: 16px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }

  /* 앞면 */
  .c3d-front {
    background: linear-gradient(135deg, #1a0533 0%, #2d0b5a 40%, #1a1060 100%);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 40px rgba(140,60,255,0.5), 0 0 80px rgba(100,40,200,0.3), inset 0 0 40px rgba(255,255,255,0.04);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden;
  }
  .c3d-front::before {
    content: ''; position: absolute; inset: 0; border-radius: 16px;
    background: linear-gradient(115deg, transparent 30%, rgba(180,120,255,0.12) 45%, rgba(255,200,255,0.18) 50%, rgba(120,180,255,0.12) 55%, transparent 70%);
    animation: shimmer 3s ease-in-out infinite;
  }
  #modal-front-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 16px;
  }

  /* 뒷면 */
  .c3d-back {
    background: url('back.png') center/cover no-repeat;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(140,60,255,0.4), 0 0 80px rgba(100,40,200,0.2);
    transform: rotateY(180deg);
    overflow: hidden;
  }

  /* 메모 오버레이 (읽기 전용 — 학생창과 동일한 다크 스타일) */
  .memo-overlay {
    position: absolute; inset: 0; border-radius: 16px;
    background: rgba(8, 4, 24, 0.78);
    backdrop-filter: blur(3px);
    display: flex; flex-direction: column;
    padding: 22px 18px 18px; overflow: hidden; gap: 12px;
    opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
  }
  .memo-overlay.active { opacity: 1; pointer-events: auto; }
  .memo-question {
    font-size: 12.5px; color: rgba(255,255,255,0.88);
    line-height: 1.6; letter-spacing: 0.02em;
    text-align: center; flex-shrink: 0;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .memo-body {
    flex: 1; font-size: 13px; line-height: 1.8;
    color: rgba(255,255,255,0.85);
    white-space: pre-wrap; overflow: hidden;
  }
  .memo-empty { color: rgba(255,255,255,0.25); font-style: italic; }

  /* 닫기 힌트 */
  .close-hint {
    position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(180,200,255,0.35); letter-spacing: 0.12em;
    white-space: nowrap;
  }

  /* ── 키프레임 ── */
  @keyframes cardSpin {
    from { transform: rotateY(0deg) rotateX(6deg); }
    to   { transform: rotateY(360deg) rotateX(6deg); }
  }
  @keyframes cardFloat {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-18px); }
  }
  @keyframes shimmer {
    0%, 100% { opacity: 0.4; transform: translateX(-30px); }
    50%       { opacity: 1;   transform: translateX(30px); }
  }
</style>
</head>
<body>

  <!-- 배경 -->
  <div id="bg">
    <iframe src="https://my.spline.design/abstractgradientbackground-q7aG6Fb1fbsmLKP67noZtC4H/"></iframe>
  </div>
  <div id="bg-blocker"></div>
  <div id="glass"></div>

  <!-- 네비 -->
  <div id="nav">
    <div class="nav-roles">
      <a href="index.html" class="role-btn">Student</a>
      <a href="teacher.html" class="role-btn">Teacher</a>
    </div>
    <div id="nav-spacer"></div>
  </div>

  <!-- 메인: 5개 슬롯 -->
  <div id="content" style="padding-top:64px;">
    <div class="deck-title">이로은 — Card Deck</div>
  <a id="analysis-link" href="analysis.html" style="
    display:none;
    font-size:11px; color:rgba(160,185,255,0.45); letter-spacing:0.12em;
    text-decoration:none; border:1px solid rgba(130,160,255,0.18);
    padding:5px 14px; border-radius:12px;
    background:rgba(100,140,255,0.06);
    transition:all 0.2s;
  " onmouseover="this.style.color='rgba(200,220,255,0.9)';this.style.borderColor='rgba(160,190,255,0.4)'"
     onmouseout="this.style.color='rgba(160,185,255,0.45)';this.style.borderColor='rgba(130,160,255,0.18)'">
    감정 분석 보기 →
  </a>
    <div class="slots-row" id="slots-row"></div>
  </div>

  <!-- 3D 카드 뷰어 모달 -->
  <div id="modal" onclick="handleModalBg(event)">
    <div style="position:relative;">
      <div class="scene">
        <div class="float-wrap" id="modal-float">
          <div class="c3d" id="modal-c3d" onclick="handleCardClick(event)">
            <div class="c3d-face c3d-front">
              <img id="modal-front-img" src="" alt="">
            </div>
            <div class="c3d-face c3d-back">
              <div class="memo-overlay" id="modal-memo">
                <div class="memo-question" id="modal-memo-question"></div>
                <div class="memo-body" id="modal-memo-text"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="close-hint">다른 곳을 누르면 닫힙니다</div>
    </div>
  </div>

<script>
  // ─── localStorage helpers ───
  function getCards(day) {
    try { return JSON.parse(sessionStorage.getItem(`deck_day${day}`) || '[]'); }
    catch { return []; }
  }
  function isDayUnlocked(day) {
    if (day === 1) return true;
    return getCards(day - 1).length > 0;
  }

  // ─── 슬롯 렌더 ───
  function renderSlots() {
    const row = document.getElementById('slots-row');
    row.innerHTML = '';

    for (let day = 1; day <= 5; day++) {
      const cards   = getCards(day);
      const unlocked = isDayUnlocked(day);

      const wrap = document.createElement('div');
      wrap.className = 'slot-wrap';

      const slot = document.createElement('div');
      slot.className = 'card-slot';
      slot.id = `slot-${day}`;

      if (!unlocked) {
        slot.classList.add('locked');
        slot.innerHTML = `<span class="locked-icon">🔒</span>`;

      } else if (cards.length === 0) {
        slot.classList.add('unplayed');
        slot.innerHTML = `<span class="unplayed-icon">✦</span>`;

      } else {
        const c = cards[0];
        slot.classList.add('filled');
        slot.innerHTML = `
          <img src="${c.cardSrc}" alt="${c.emotion}"
               onerror="this.style.display='none'">
          <div class="slot-emotion-tag">${c.emotion}</div>
        `;
        slot.onclick = () => openCardModal(c);
      }

      const label = document.createElement('div');
      label.className = 'slot-day-label';
      label.textContent = `${day}일차`;

      wrap.appendChild(slot);
      wrap.appendChild(label);
      row.appendChild(wrap);
    }
  }


  // ─── 3D 카드 뷰어 ───
  let mState = null;

  function openCardModal(card) {
    mState = 'spinning';

    const img  = document.getElementById('modal-front-img');
    img.src    = card.cardSrc || '';
    img.style.display = card.cardSrc ? 'block' : 'none';

    const questionEl = document.getElementById('modal-memo-question');
    questionEl.textContent = card.question || '';

    const memoEl = document.getElementById('modal-memo-text');
    if (card.memo && card.memo.trim()) {
      memoEl.textContent = card.memo;
      memoEl.classList.remove('memo-empty');
    } else {
      memoEl.textContent = '(메모 없음)';
      memoEl.classList.add('memo-empty');
    }

    const c3d      = document.getElementById('modal-c3d');
    const floatWrap = document.getElementById('modal-float');
    const memo     = document.getElementById('modal-memo');

    memo.classList.remove('active');
    c3d.style.transition   = '';
    c3d.style.transform    = '';
    c3d.style.animation    = 'cardSpin 8s linear infinite';
    floatWrap.style.animation = 'cardFloat 4s ease-in-out infinite';
    floatWrap.style.transform = '';

    document.getElementById('modal').classList.add('active');
  }

  function handleCardClick(e) {
    e.stopPropagation();
    const c3d      = document.getElementById('modal-c3d');
    const floatWrap = document.getElementById('modal-float');
    const memo     = document.getElementById('modal-memo');

    if (mState === 'spinning') {
      // 스피닝 → 앞면
      c3d.style.animation       = 'none';
      floatWrap.style.animation = 'none';
      floatWrap.style.transform = 'translateY(0)';
      void c3d.offsetHeight;
      c3d.style.transition = 'transform 0.7s cubic-bezier(0.4,0,0.2,1)';
      c3d.style.transform  = 'rotateY(0deg) rotateX(0deg)';
      mState = 'front';

    } else if (mState === 'front') {
      // 앞면 → 뒷면
      c3d.style.transition = 'transform 0.7s cubic-bezier(0.4,0,0.2,1)';
      c3d.style.transform  = 'rotateY(180deg) rotateX(0deg)';
      setTimeout(() => memo.classList.add('active'), 360);
      mState = 'back';
    }
  }

  function handleModalBg(e) {
    if (e.target === document.getElementById('modal')) closeModal();
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
    mState = null;
  }

  // ─── 초기화 ───
  if (sessionStorage.getItem('nav_source') === 'teacher') {
    document.getElementById('analysis-link').style.display = 'inline-block';
  }
  renderSlots();
</script>
</body>
</html>
