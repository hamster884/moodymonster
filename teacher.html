<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공공데이터대회 - Teacher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }

  /* ── 역할 네비 ── */
  #role-nav {
    position: fixed; top: 24px; left: 24px;
    z-index: 100; display: flex; gap: 8px;
  }
  .role-btn {
    padding: 8px 20px; border-radius: 20px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.06em;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.5);
    backdrop-filter: blur(10px);
    transition: all 0.2s ease;
  }
  .role-btn:hover { background: rgba(255,255,255,0.12); color: white; }
  .role-btn.active {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.45);
    color: white;
  }

  /* ── 배경 ── */
  #bg { position: fixed; inset: 0; z-index: 0; }
  #bg iframe { width: 100%; height: 100%; border: none; display: block; }
  #bg-blocker { position: fixed; inset: 0; z-index: 1; }
  #dark-overlay { position: fixed; inset: 0; z-index: 2; background: rgba(0,0,0,0.45); }
  #glass {
    position: fixed; inset: 0; z-index: 3;
    background: rgba(10,5,30,0.35);
    backdrop-filter: blur(18px) saturate(0.8);
    -webkit-backdrop-filter: blur(18px) saturate(0.8);
    border-top: 1px solid rgba(255,255,255,0.06);
    pointer-events: none;
  }

  /* ── 콘텐츠 ── */
  #content {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
  }

  .page-title {
    font-size: 13px; color: rgba(255,255,255,0.35);
    letter-spacing: 0.2em; text-transform: uppercase;
  }

  /* ── 덱 그리드 ── */
  .deck-grid {
    display: flex; flex-direction: column;
    align-items: center; gap: 20px;
  }
  .deck-row {
    display: flex; gap: 20px; align-items: flex-start;
  }

  /* 덱 슬롯 공통 */
  .deck-slot {
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
    cursor: default;
  }
  .deck-slot .deck-card {
    width: 80px; height: 112px;
    border-radius: 8px;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 10px;
    font-size: 11px; letter-spacing: 0.04em;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .deck-slot .deck-name {
    font-size: 12px; color: rgba(255,255,255,0.55);
    letter-spacing: 0.03em;
  }

  /* 공통: 모든 덱 카드에 back.png */
  .deck-slot .deck-card {
    background: url('back.png') center/cover no-repeat !important;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  }

  /* 이로은 덱 (실제) */
  .deck-slot.real .deck-card {
    color: white;
    font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 20px rgba(180,120,255,0.3);
    cursor: pointer;
  }
  .deck-slot.real .deck-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 30px rgba(180,120,255,0.5);
  }
  .deck-slot.real .deck-name {
    color: rgba(255,255,255,0.9);
    font-weight: 500;
  }

  /* 다른 학생 덱 (허구) */
  .deck-slot.ghost .deck-card {
    filter: grayscale(1) brightness(0.3);
    color: rgba(255,255,255,0.5);
  }
  .deck-slot.ghost .deck-name {
    color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>

  <!-- 역할 네비 -->
  <div id="role-nav">
    <a href="index.html" class="role-btn">Student</a>
    <a href="teacher.html" class="role-btn active">Teacher</a>
  </div>

  <!-- 배경 -->
  <div id="bg">
    <iframe src="https://my.spline.design/abstractgradientbackground-q7aG6Fb1fbsmLKP67noZtC4H/"></iframe>
  </div>
  <div id="bg-blocker"></div>
  <div id="dark-overlay"></div>
  <div id="glass"></div>

  <!-- 콘텐츠 -->
  <div id="content">
    <div class="page-title">Class Deck Overview</div>

    <div class="deck-grid">

      <!-- 1줄: 5명 -->
      <div class="deck-row">
        <!-- 이로은 (실제 작동) -->
        <div class="deck-slot real">
          <div class="deck-card" onclick="sessionStorage.setItem('nav_source','teacher'); location.href='deck.html'">이로은</div>
          <div class="deck-name">이로은</div>
        </div>
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 1</div>
        </div>
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 2</div>
        </div>
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 3</div>
        </div>
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 4</div>
        </div>
      </div>

      <!-- 2줄: 5명 -->
      <div class="deck-row">
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 5</div>
        </div>
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 6</div>
        </div>
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 7</div>
        </div>
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 8</div>
        </div>
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 9</div>
        </div>
      </div>

      <!-- 3줄: 4명 -->
      <div class="deck-row">
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 10</div>
        </div>
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 11</div>
        </div>
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 12</div>
        </div>
        <div class="deck-slot ghost">
          <div class="deck-card">덱</div>
          <div class="deck-name">학생 13</div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
